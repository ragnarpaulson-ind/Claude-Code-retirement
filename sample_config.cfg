# Retirement Simulation Config
# Lines starting with # are comments. Format is key=value.
# Fill in YOUR real numbers -- everything below is a placeholder.
#
# "person_a" / "person_b" map to the two columns in your "Detailed Plan Live"
# sheet (Ragnar / Jen). Rename them below if you like.

person_a_name=PersonA
person_b_name=PersonB

person_a_dob=1961-05-23
person_b_dob=1962-03-15

# When each person plans to start CPP and OAS (can be before/at/after age 65 --
# the simulator applies the standard 0.6%/mo early-CPP reduction, 0.7%/mo
# late-CPP bonus, and 0.6%/mo late-OAS bonus automatically).
person_a_cpp_start=2027-01-30
person_b_cpp_start=2027-01-30
person_a_oas_start=2027-01-30
person_b_oas_start=2027-01-30

# Monthly CPP/OAS amount if started exactly at 65, in today's dollars
# (this is your "March 2024" sheet C4:C7).
person_a_cpp_at_65=1572.38
person_a_oas_at_65=777.94
person_b_cpp_at_65=911.88
person_b_oas_at_65=742.31

retirement_date=2026-04-30

# Simulation window. sim_start_date defaults to today if omitted.
sim_start_date=2026-08-05
sim_years=40

# Starting account balances. TFSA can stay combined (it's not subject to any
# minimum-withdrawal rule). Registered accounts (RRSP/LIF/RRIF) are tracked
# per person, since CRA's RRIF minimum withdrawal is calculated per account.
tfsa_balance=0
person_a_registered_balance=0
person_b_registered_balance=0

# Percent per year
roi_annual_pct=5.0
personal_inflation_pct=2.5
gov_inflation_pct=2.0

# Household monthly spending target, AFTER tax, in today's dollars
target_net_monthly=9600

# PER-PERSON monthly income target, BEFORE tax, in today's dollars.
# (Yes, per-person -- the sheet targets this amount for each spouse
# individually via CPP/OAS + RRIF draw, to use each person's own tax
# brackets. Total household gross is roughly 2x this figure.)
target_gross_monthly=4583

# "Go slow" years: personal-spending inflation raises pause during this
# window, then resume. Set go_slow_year=0 to disable.
go_slow_year=2033
go_slow_resume_after_years=8

# One-time events (big-ticket purchases, home sale, downsizing) --
# see sample_events.csv. Leave commented out to skip.
events_file=sample_events.csv

# Tax brackets: lower_limit,combined_marginal_rate (annual, today's dollars).
# Add or remove lines freely -- as many brackets as you need.
tax_bracket=0,0.0000
tax_bracket=12989,0.0505
tax_bracket=16452,0.1905
tax_bracket=47630,0.2315
tax_bracket=58523,0.2965
tax_bracket=98259,0.3166
tax_bracket=117045,0.3716

# Age credit (65+), federal and provincial, with income-tested clawback.
fed_age_credit_amount=9028
fed_age_credit_rate=0.15
fed_age_credit_clawback_start=45522
prov_age_credit_amount=5793
prov_age_credit_rate=0.0505
prov_age_credit_clawback_start=44325
age_credit_clawback_rate=0.15

# add rent payments after selling house
rent_start_date=2041-05-01
rent_monthly=2000

# Monte Carlo config
mc_trials=10000
mc_returns_file=proxy-30-year.csv
